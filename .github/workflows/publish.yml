name: Build and publish

on:
  push:
    branches: [dev, prod]
    tags: ['v*']
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: KStacks-org/infra/.github/workflows/java.yml@ee06961c76b5f7735de3a4538e627221b9b58d53

  deploy:
    needs: build
    uses: KStacks-org/infra/.github/workflows/deploy.yml@ee06961c76b5f7735de3a4538e627221b9b58d53
    with:
      image-tag: ${{ needs.build.outputs.image-tag }}
    secrets:
      INFRA_PAT: ${{ secrets.INFRA_PAT }}
